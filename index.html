<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="M POS">
<title>BAR LOUNGE M — レジ / 売上管理</title>
<style>
  :root {
    --pink:#FF2E86; --magenta:#E0369F; --purple:#7B3FE4;
    --grad: linear-gradient(100deg,var(--pink) 0%,var(--magenta) 48%,var(--purple) 100%);
    --ink:#3D2A39; --ink-soft:#7C6675; --ink-faint:#B9A5B4;
    --bg:#FBF6F9; --card:#FFFFFF; --rule:#EEDCE8; --blush:#FFEFF7;
    --ok:#1F9D6B; --warn:#D9822B; --danger:#D5386B;
    --round:"Hiragino Maru Gothic ProN","Zen Maru Gothic","Yu Gothic",YuGothic,Meiryo,sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--round);
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  }
  button { font-family:inherit; cursor:pointer; }
  input,select { font-family:inherit; font-size:1rem; }
  :focus-visible { outline:3px solid var(--magenta); outline-offset:2px; }

  /* ---------- app shell ---------- */
  .topbar {
    display:flex; align-items:center; gap:12px;
    padding:10px 16px; background:var(--card); border-bottom:1px solid var(--rule);
    position:sticky; top:0; z-index:20;
  }
  .brand { display:flex; align-items:center; gap:9px; margin-right:6px; }
  .brand svg { width:20px; }
  .brand b { font-family:Candara,"Gill Sans MT",sans-serif; font-weight:400; letter-spacing:.12em; font-size:.95rem; white-space:nowrap; }
  .nav { display:flex; gap:6px; flex:1; }
  .nav button {
    border:1px solid var(--rule); background:#fff; color:var(--ink-soft);
    padding:9px 16px; border-radius:999px; font-size:.88rem; font-weight:700;
  }
  .nav button[aria-current="true"] { background:var(--grad); color:#fff; border-color:transparent; }
  .clock { font-variant-numeric:tabular-nums; color:var(--ink-soft); font-size:.85rem; }

  main { padding:16px; max-width:1400px; margin:0 auto; }
  h2.title { margin:0 0 14px; font-size:1.05rem; letter-spacing:.06em; }

  /* ---------- seats ---------- */
  .seat-group { margin-bottom:22px; }
  .seat-group > h3 {
    margin:0 0 10px; font-size:.74rem; letter-spacing:.22em; color:var(--magenta);
  }
  .seats { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  .seat {
    border:1px solid var(--rule); background:var(--card); border-radius:18px;
    padding:14px 15px; text-align:left; min-height:112px;
    display:flex; flex-direction:column; gap:6px; transition:transform .08s;
  }
  .seat:active { transform:scale(.98); }
  .seat .no { font-size:1.15rem; font-weight:700; letter-spacing:.04em; }
  .seat .empty { color:var(--ink-faint); font-size:.82rem; }
  .seat.busy { border-color:transparent; box-shadow:0 0 0 2px var(--magenta) inset; background:var(--blush); }
  .seat .meta { font-size:.78rem; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .seat .amount { margin-top:auto; font-size:1.1rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .seat .over { color:var(--warn); font-weight:700; }

  /* ---------- ticket ---------- */
  .pos { display:grid; grid-template-columns:minmax(340px,400px) minmax(0,1fr); gap:14px; align-items:start; }
  @media (max-width:900px){ .pos { grid-template-columns:1fr; } }

  .panel { background:var(--card); border:1px solid var(--rule); border-radius:18px; padding:14px; }

  .ticket-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .ticket-head .seatno { font-size:1.2rem; font-weight:700; }
  .pill {
    border:1px solid var(--rule); background:#fff; border-radius:999px;
    padding:6px 12px; font-size:.8rem; color:var(--ink-soft); font-variant-numeric:tabular-nums;
  }
  .pill.warn { border-color:var(--warn); color:var(--warn); font-weight:700; }
  .pill.on { border-color:var(--magenta); color:var(--magenta); font-weight:700; background:var(--blush); }

  .lines { display:flex; flex-direction:column; gap:2px; margin:6px 0 12px; max-height:46vh; overflow-y:auto; }
  .line { display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; padding:8px 4px; border-bottom:1px dotted var(--rule); }
  .line .nm { font-size:.9rem; }
  .line .nm small { display:block; color:var(--magenta); font-size:.7rem; }
  .line .qty { display:flex; align-items:center; gap:6px; }
  .line .qty button {
    width:34px; height:34px; border-radius:10px; border:1px solid var(--rule);
    background:#fff; font-size:1.05rem; font-weight:700; color:var(--ink-soft);
  }
  .line .qty span { min-width:20px; text-align:center; font-variant-numeric:tabular-nums; font-weight:700; }
  .line .amt { font-variant-numeric:tabular-nums; font-weight:700; min-width:74px; text-align:right; }
  .line.fixed .qty span { min-width:auto; }
  .empty-note { color:var(--ink-faint); font-size:.85rem; padding:18px 4px; }

  .totals { border-top:2px solid var(--rule); padding-top:10px; display:flex; flex-direction:column; gap:6px; }
  .totals div { display:flex; justify-content:space-between; font-size:.88rem; color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .totals div.grand { font-size:1.25rem; color:var(--ink); font-weight:700; padding-top:6px; }

  .actions { display:flex; gap:8px; margin-top:12px; }
  .btn {
    flex:1; border:none; border-radius:14px; padding:15px 12px; font-size:.95rem; font-weight:700; color:#fff;
    background:var(--grad); min-height:52px;
  }
  .btn.ghost { background:#fff; color:var(--ink-soft); border:1px solid var(--rule); }
  .btn.danger { background:#fff; color:var(--danger); border:1px solid #F3CBD9; }
  .btn:active { filter:brightness(.95); }
  .btn[disabled] { opacity:.45; }

  /* ---------- menu grid ---------- */
  .cats { display:flex; flex-wrap:wrap; gap:7px; padding-bottom:10px; }
  .cats button {
    white-space:nowrap; border:1px solid var(--rule); background:#fff; color:var(--ink-soft);
    border-radius:999px; padding:9px 15px; font-size:.85rem; font-weight:700;
  }
  .cats button[aria-current="true"] { background:var(--grad); color:#fff; border-color:transparent; }
  .items { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .item {
    border:1px solid var(--rule); background:#fff; border-radius:16px; padding:12px;
    text-align:left; min-height:78px; display:flex; flex-direction:column; gap:6px;
  }
  .item:active { background:var(--blush); }
  .item .nm { font-size:.9rem; font-weight:700; line-height:1.35; }
  .item .pr { margin-top:auto; font-variant-numeric:tabular-nums; color:var(--magenta); font-weight:700; font-size:.9rem; }

  /* ---------- report ---------- */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px; }
  .kpi { background:var(--card); border:1px solid var(--rule); border-radius:16px; padding:14px; }
  .kpi span { display:block; font-size:.72rem; letter-spacing:.16em; color:var(--ink-faint); }
  .kpi b { display:block; margin-top:6px; font-size:1.5rem; font-variant-numeric:tabular-nums; }
  table { width:100%; border-collapse:collapse; font-size:.86rem; }
  th,td { padding:9px 8px; border-bottom:1px solid var(--rule); text-align:left; }
  th { font-size:.7rem; letter-spacing:.14em; color:var(--ink-faint); font-weight:700; }
  td.num,th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .scroll { overflow-x:auto; }
  .tiny { font-size:.78rem; color:var(--ink-soft); }
  .linkish { background:none; border:none; color:var(--danger); font-size:.8rem; padding:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid var(--rule); background:var(--blush); color:var(--magenta);
          border-radius:999px; padding:6px 12px; font-size:.8rem; font-weight:700; }

  /* ---------- settings ---------- */
  .field { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .field label { font-size:.86rem; min-width:190px; }
  .field input[type="number"], .field input[type="text"] {
    border:1px solid var(--rule); border-radius:10px; padding:9px 11px; width:130px;
    font-variant-numeric:tabular-nums;
  }
  .field input[type="text"].wide { width:min(340px,100%); }
  .subhead { margin:22px 0 10px; font-size:.74rem; letter-spacing:.2em; color:var(--magenta); }

  /* ---------- modal ---------- */
  .backdrop {
    position:fixed; inset:0; background:rgba(61,42,57,.45); display:flex;
    align-items:center; justify-content:center; padding:18px; z-index:50;
  }
  .modal {
    background:var(--card); border-radius:22px; padding:20px; width:min(460px,100%);
    max-height:88vh; overflow-y:auto;
  }
  .modal h3 { margin:0 0 14px; font-size:1rem; }
  .stepper { display:flex; align-items:center; justify-content:center; gap:18px; margin:10px 0 18px; }
  .stepper button { width:60px; height:60px; border-radius:20px; border:1px solid var(--rule); background:#fff; font-size:1.5rem; font-weight:700; color:var(--magenta); }
  .stepper b { font-size:2.2rem; font-variant-numeric:tabular-nums; min-width:70px; text-align:center; }
  .choices { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px; }
  .choices button { border:1px solid var(--rule); background:#fff; border-radius:14px; padding:14px 10px; font-size:.9rem; font-weight:700; }
  .choices button.sel { background:var(--grad); color:#fff; border-color:transparent; }
  .choices button small { display:block; margin-top:4px; font-weight:400; font-size:.74rem; opacity:.75; font-variant-numeric:tabular-nums; }
  .pay-input { width:100%; border:1px solid var(--rule); border-radius:14px; padding:14px; font-size:1.4rem; text-align:right; font-variant-numeric:tabular-nums; }
  .change { display:flex; justify-content:space-between; font-size:1.1rem; font-weight:700; margin-top:12px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg viewBox="0 0 60 72" aria-hidden="true">
      <defs><linearGradient id="pt" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#7B3FE4"/><stop offset="52%" stop-color="#E0369F"/><stop offset="100%" stop-color="#FF2E86"/>
      </linearGradient></defs>
      <g fill="url(#pt)">
        <path d="M8 70 C2 50 4 22 16 2 C24 24 22 50 14 70 Z"/>
        <path d="M24 68 C20 52 22 30 32 14 C38 32 36 54 30 68 Z"/>
        <path d="M39 66 C37 54 40 38 48 26 C52 40 50 56 45 66 Z"/>
      </g>
    </svg>
    <b>M POS</b>
  </div>
  <nav class="nav" id="nav"></nav>
  <span class="clock" id="clock"></span>
</div>

<main id="app"></main>
<div id="modal-root"></div>

<script>
"use strict";

/* ============ storage ============ */

const KEY = "blm-pos-v1";

/* メニュー/料率を変更したら上げる。既存iPadの保存データを新しい既定値に入れ替える */
const MENU_VERSION = 10;

function defaultMenu() {
  const m = (cat, name, price, backType) => ({ id: cat + ":" + name, cat, name, price, backType: backType || null });
  return [
    m("同伴・システム", "同伴", 2000, "dohan"),
    m("キャストドリンク", "ドリンク 小", 1500, "small"),
    m("キャストドリンク", "ドリンク 大", 3000, "large"),
    m("キャストドリンク", "ピッチャー", 5000, "pitcher"),
    m("アルコール", "瓶ビール", 1000),
    m("アルコール", "スラット", 1000),
    m("アルコール", "氷結", 1000),
    m("ショット", "テキーラ", 1000),
    m("ショット", "クライナー", 1000),
    m("ショット", "コカボム", 1000),
    m("ショット", "ウォッカ", 1000),
    m("ショット", "イェガー", 1000),
    m("ショット", "テキーラ観覧車", 15000),
    m("シャンパン", "オリシャン", 20000, "pct"),
    m("シャンパン", "オリシャン ロゼ", 40000, "pct"),
    m("シャンパン", "ヴーヴ イエロー", 30000, "pct"),
    m("シャンパン", "ヴーヴ ホワイト", 35000, "pct"),
    m("シャンパン", "ドンペリ", 60000, "pct"),
    m("シャンパン", "ベルエポック", 80000, "pct"),
    m("シャンパン", "アルマンド", 120000, "pct"),
    m("シャンパン", "エンジェル", 180000, "pct"),
    m("ボトル", "黒霧島", 12000),
    m("ボトル", "吉四六", 14000),
    m("ボトル", "茉莉花", 10000),
    m("ボトル", "サントリー 角", 12000),
    m("ボトル", "白州", null),
    m("ボトル", "山崎", null),
    m("ボトル", "響 17年", null),
    m("ボトル", "マッカラン 17年", null),
    m("ソフトドリンク", "コーラ", 700),
    m("ソフトドリンク", "オレンジ", 700),
    m("ソフトドリンク", "アップル", 700),
    m("ソフトドリンク", "緑茶", 700),
    m("ソフトドリンク", "ウーロン茶", 700),
    m("ソフトドリンク", "ジャスミン茶", 700),
    m("割物", "割物", 2000),
  ];
}

function defaultState() {
  return {
    settings: {
      counterSeats: 6, boxSeats: 4,
      counterSet: 2000, boxSet: 3000, freeSet: 6000, setMinutes: 60,
      cardFeePct: 10, servicePct: 20,
      casts: ["さやか", "まい", "もえ", "りね", "まひろ"],
      back: { dohan: 0, small: 100, large: 500, pitcher: 500, pct: 10 },
      /* 指名バック（%）。シャンパン・ボトルは対象外 */
      nominate: { normal: 10, self: 20, dohan: 30 },
      deductPct: 10,
      wages: { さやか: 2500, まい: 2000, もえ: 1500, りね: 1500, まひろ: 1500 },
      expenseCats: ["仕入れ", "おしぼり", "家賃", "カラオケ", "光熱費", "消耗品", "広告", "その他"],
      staff: ["ふみや", "きみ", "さやか", "まい", "もえ", "りね", "まひろ"],
    },
    menu: defaultMenu(),
    menuVersion: MENU_VERSION,
    tickets: [],
    expenses: [],
    shifts: [],
    adjustments: [],
    manualSales: [],
    payOverrides: [],
    seq: 1,
  };
}

let state = load();
let view = { name: "tables", ticketId: null, cat: "同伴・システム" };

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const st = Object.assign(defaultState(), parsed);
    st.settings = Object.assign(defaultState().settings, parsed.settings || {});
    st.settings.back = Object.assign(defaultState().settings.back, (parsed.settings || {}).back || {});
    st.settings.nominate = Object.assign(defaultState().settings.nominate, (parsed.settings || {}).nominate || {});
    st.settings.wages = Object.assign(defaultState().settings.wages, (parsed.settings || {}).wages || {});
    if (st.menuVersion !== MENU_VERSION) return migrate(st);
    return st;
  } catch (e) {
    console.warn("state load failed, starting fresh", e);
    return defaultState();
  }
}

/* 保存済みの古いメニュー・料率を最新の既定値に入れ替える。売上履歴とキャスト設定は残す */
function migrate(st) {
  const d = defaultState();
  st.menu = d.menu;
  /* 初期サンプルのままなら実際のキャスト名に入れ替える */
  const oldCasts = ["キャストA,キャストB,キャストC", "きみ,まい,さやか,はな,もえ"];
  if (oldCasts.includes(st.settings.casts.join())) st.settings.casts = d.settings.casts;
  /* 仮置きのバック額のままなら実際のルールに合わせる */
  if (JSON.stringify(st.settings.back) === JSON.stringify({ dohan: 1000, small: 500, large: 1000, pitcher: 1500, pct: 10 }))
    st.settings.back = d.settings.back;
  st.settings.servicePct = d.settings.servicePct;
  st.settings.cardFeePct = d.settings.cardFeePct;
  st.menuVersion = MENU_VERSION;
  return st;
}

let saveFailed = false;

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    if (!saveFailed) {
      saveFailed = true;
      console.warn("save failed", e);
      alert("保存できませんでした。この画面ではデータが残りません（ファイルを直接開いた場合など）。");
    }
  }
}

/* ============ helpers ============ */

const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function hhmm(ts) { const d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function minutesSince(ts) { return Math.floor((Date.now() - ts) / 60000); }

function seatLabels() {
  const s = state.settings, out = [];
  for (let i = 1; i <= s.counterSeats; i++) out.push({ id: "C" + i, type: "counter", label: "カウンター " + i });
  for (let i = 1; i <= s.boxSeats; i++) out.push({ id: "B" + i, type: "box", label: "ボックス " + i });
  return out;
}

function openTicketOf(seatId) { return state.tickets.find(t => t.seatId === seatId && t.status === "open") || null; }
function ticketById(id) { return state.tickets.find(t => t.id === id) || null; }

/* 旧データには plan が無いので席種をそのままプランとして扱う */
function planOf(t) { return t.plan || t.seatType; }
function planLabel(p) { return p === "free" ? "フリータイム" : p === "box" ? "ボックス" : "カウンター"; }

function setUnit(t) {
  const p = planOf(t);
  if (p === "free") return state.settings.freeSet;
  return p === "box" ? state.settings.boxSet : state.settings.counterSet;
}

function totals(t, method) {
  const setAmount = setUnit(t) * t.people * t.sets;
  const itemAmount = t.items.reduce((a, it) => a + it.price * it.qty, 0);
  const subtotal = setAmount + itemAmount;
  const service = Math.round(subtotal * state.settings.servicePct / 100);
  const base = subtotal + service;
  const cardFee = method === "card" ? Math.round(base * state.settings.cardFeePct / 100) : 0;
  return { setAmount, itemAmount, subtotal, service, cardFee, total: base + cardFee };
}

function overMinutes(t) {
  const limit = state.settings.setMinutes * t.sets;
  return minutesSince(t.openedAt) - limit;
}

function isFree(t) { return planOf(t) === "free"; }

/* ============ render ============ */

const app = document.getElementById("app");

function render() {
  renderNav();
  if (view.name === "tables") renderTables();
  else if (view.name === "ticket") renderTicket();
  else if (view.name === "report") renderReport();
  else if (view.name === "payroll") renderPayroll();
  else renderSettings();
}

function renderNav() {
  const tabs = [["tables", "卓・レジ"], ["report", "売上"], ["payroll", "月次・給与"], ["settings", "設定"]];
  document.getElementById("nav").innerHTML = tabs.map(([k, label]) =>
    `<button data-act="go" data-view="${k}" aria-current="${view.name === k || (k === "tables" && view.name === "ticket")}">${label}</button>`
  ).join("");
}

function renderTables() {
  const groups = [["counter", "カウンター"], ["box", "ボックス"]];
  const html = groups.map(([type, label]) => {
    const seats = seatLabels().filter(s => s.type === type).map(s => {
      const t = openTicketOf(s.id);
      if (!t) {
        return `<button class="seat" data-act="open-seat" data-seat="${s.id}" data-type="${type}">
          <span class="no">${s.id}</span><span class="empty">空席</span>
        </button>`;
      }
      const over = overMinutes(t);
      const sum = totals(t, "cash").total;
      const status = isFree(t)
        ? "フリータイム"
        : (over >= 0 ? "延長 " + over + "分 超過" : "セット残 " + (-over) + "分");
      return `<button class="seat busy" data-act="go-ticket" data-id="${t.id}">
        <span class="no">${s.id}</span>
        <span class="meta">${t.people}名 ・ ${hhmm(t.openedAt)}〜 <span data-since="${t.openedAt}">${minutesSince(t.openedAt)}分</span></span>
        <span class="meta ${!isFree(t) && over >= 0 ? "over" : ""}">${status}</span>
        <span class="amount">${yen(sum)}</span>
      </button>`;
    }).join("");
    return `<div class="seat-group"><h3>${label}</h3><div class="seats">${seats}</div></div>`;
  }).join("");
  app.innerHTML = `<h2 class="title">卓一覧</h2>${html}`;
}

function renderTicket() {
  const t = ticketById(view.ticketId);
  if (!t || t.status !== "open") { view = { ...view, name: "tables" }; return render(); }

  const cats = [...new Set(state.menu.map(m => m.cat))];
  if (!cats.includes(view.cat)) view.cat = cats[0];
  const tt = totals(t, "cash");
  const over = overMinutes(t);

  const lines = t.items.length === 0
    ? `<p class="empty-note">セット料金のみです。右のメニューから追加してください。</p>`
    : t.items.map((it, i) => `<div class="line">
        <span class="nm">${esc(it.name)}${it.cast ? `<small>${esc(it.cast)}</small>` : ""}</span>
        <span class="qty">

/* 指名バックの対象売上。シャンパンとボトルは専用バックがあるので除外する */
function nominateBase(t) {
  const excluded = ["シャンパン", "ボトル"];
  const items = t.items.filter(it => !excluded.includes(it.cat || String(it.menuId).split(":")[0]));
  return setUnit(t) * t.people * t.sets + items.reduce((a, it) => a + it.price * it.qty, 0);
}

function castSummary(tickets) {
  const map = new Map();
  const rate = state.settings.back;
  const get = n => {
    if (!map.has(n)) map.set(n, { cast: n, groups: 0, nomSales: 0, nomBack: 0, count: 0, drinkBack: 0 });
    return map.get(n);
  };

  tickets.forEach(t => {
    if (t.nominee) {
      const base = nominateBase(t);
      const pct = state.settings.nominate[t.origin || "normal"] || 0;
      const c = get(t.nominee);
      c.groups += 1;
      c.nomSales += base;
      c.nomBack += Math.round(base * pct / 100);
    }
    t.items.forEach(it => {
      if (!it.cast || !it.backType) return;
      const amount = it.price * it.qty;
      const back = it.backType === "pct" ? Math.round(amount * rate.pct / 100) : (rate[it.backType] || 0) * it.qty;
      const c = get(it.cast);
      c.count += it.qty;
      c.drinkBack += back;
    });
  });

  return [...map.values()]
    .map(c => ({ ...c, total: c.nomBack + c.drinkBack }))
    .sort((a, b) => b.total - a.total);
}

/* ================= 月次・給与 ================= */

function monthKey(d) { return String(d).slice(0, 7); }
function currentMonth() { return view.month || monthKey(dayKey(Date.now())); }
function monthOf(list, m) { return list.filter(x => monthKey(x.date) === m); }

function monthTickets(m) {
  return state.tickets.filter(t => t.status === "closed" && monthKey(dayKey(t.closedAt)) === m);
}

/* 時給×時間 ＋ バック ＋ 手当控除 で1ヶ月の支給額を出す */
function payroll(m) {
  const map = new Map();
  const get = n => {
    if (!map.has(n)) map.set(n, { cast: n, days: 0, hours: 0, wage: 0, back: 0, adj: 0 });
    return map.get(n);
  };
  monthOf(state.shifts, m).forEach(s => {
    const c = get(s.cast);
    c.days += 1; c.hours += s.hours; c.wage += Math.round(s.hours * s.rate); c.back += Number(s.back || 0);
  });
  castSummary(monthTickets(m)).forEach(c => { get(c.cast).back += c.total; });
  monthOf(state.adjustments, m).forEach(a => { get(a.cast).adj += a.amount; });
  return [...map.values()].map(c => applyOverride(c, m)).sort((a, b) => b.pay - a.pay);
}

function findOverride(m, cast) {
  return state.payOverrides.find(o => o.month === m && o.cast === cast) || null;
}

/* 手修正があればそれを優先し、無ければ自動計算の値を使う */
function applyOverride(c, m) {
  const ov = findOverride(m, c.cast);
  const autoBack = c.back;
  const back = ov && ov.back != null ? ov.back : autoBack;
  const gross = c.wage + back + c.adj;
  const pct = ov && ov.deductPct != null ? ov.deductPct : (state.settings.deductPct || 0);
  const deduct = Math.round(gross * pct / 100);
  const pay = ov && ov.pay != null ? ov.pay : gross - deduct;
  return { ...c, autoBack, back, gross, deductPct: pct, deduct, pay, edited: !!ov };
}

function castOptions(sel) {
  return state.settings.casts.map(c =>
    `<option value="${esc(c)}" ${c === sel ? "selected" : ""}>${esc(c)}</option>`).join("");
}

function dateField(id, label, value) {
  return `<p class="tiny" style="margin:0 0 6px">${label}</p>
   <input class="pay-input" style="text-align:left; font-size:1.05rem" type="date" id="${id}" value="${value || dayKey(Date.now())}">`;
}

function timeOptions(sel) {
  let out = "";
  for (let i = 0; i < 48; i++) {
    const v = String(Math.floor(i / 2)).padStart(2, "0") + ":" + (i % 2 ? "30" : "00");
    out += `<option value="${v}" ${v === sel ? "selected" : ""}>${v}</option>`;
  }
  return out;
}

/* 深夜跨ぎ（20:00→翌3:00）も正しく出す */
function hoursBetween(start, end) {
  const toMin = t => Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5));
  return ((toMin(end) - toMin(start) + 1440) % 1440) / 60;
}

function askShift(onOk, cur = {}) {
  const first = cur.cast || state.settings.casts[0] || "";
  const st = cur.start || state.settings.shiftStart || "20:00";
  const en = cur.end || state.settings.shiftEnd || "03:00";
  openModal(`
    <h3>${cur.id ? "出勤を編集" : "出勤を追加"}</h3>
    ${dateField("sd", "日付", cur.date)}
    <p class="tiny" style="margin:14px 0 6px">キャスト</p>
    <select class="pay-input" style="text-align:left; font-size:1.05rem" id="sc">${castOptions(first)}</select>
    <p class="tiny" style="margin:14px 0 6px">時間（30分刻み）</p>
    <div style="display:flex; align-items:center; gap:8px">
      <select class="pay-input" style="text-align:left; font-size:1.05rem" id="s1">${timeOptions(st)}</select>
      <span class="tiny">〜</span>
      <select class="pay-input" style="text-align:left; font-size:1.05rem" id="s2">${timeOptions(en)}</select>
    </div>
    <p class="tiny" style="margin:8px 0 0; text-align:right">実働 <b id="shh">${hoursBetween(st, en)}</b> 時間</p>
    <p class="tiny" style="margin:14px 0 6px">時給（円）</p>
    <input class="pay-input" inputmode="numeric" id="sr" value="${cur.rate || state.settings.wages[first] || 1500}">
    <p class="tiny" style="margin:14px 0 6px">この日のドリンクバック（任意・手入力分）</p>
    <input class="pay-input" inputmode="numeric" id="sb" value="${cur.back || ""}" placeholder="0">
    <div class="actions">
      <button class="btn ghost" data-x="cancel">やめる</button>
      <button class="btn" data-x="ok">記録する</button>
    </div>`, btn => {
    if (btn.dataset.x === "cancel") return closeModal();
    if (btn.dataset.x !== "ok") return;
    const date = modalRoot.querySelector("#sd").value;
    const cast = modalRoot.querySelector("#sc").value;
    const start = modalRoot.querySelector("#s1").value;
    const end = modalRoot.querySelector("#s2").value;
    const rate = Number(modalRoot.querySelector("#sr").value.replace(/[^0-9]/g, ""));
    const back = Number(modalRoot.querySelector("#sb").value.replace(/[^0-9]/g, "")) || 0;
    const hours = hoursBetween(start, end);
    if (!date || !cast) return alert("日付とキャストを選んでください。");
    if (!hours) return alert("開始と終了が同じ時刻です。");
    if (!rate) return alert("時給を入れてください。");
    state.settings.wages[cast] = rate;
    state.settings.shiftStart = start;
    state.settings.shiftEnd = end;
    closeModal();
    onOk({ id: cur.id || "s" + Date.now() + Math.random().toString(36).slice(2, 5), date, cast, start, end, hours, rate, back });

  const sel = modalRoot.querySelector("#sc");
  sel.addEventListener("change", () => {
    modalRoot.querySelector("#sr").value = state.settings.wages[sel.value] || 1500;
  });
  const upd = () => {
    modalRoot.querySelector("#shh").textContent =
      hoursBetween(modalRoot.querySelector("#s1").value, modalRoot.querySelector("#s2").value);
  };
  modalRoot.querySelector("#s1").addEventListener("change", upd);

const modalRoot = document.getElementById("modal-root");
let modalOnClick = null;

function openModal(html, onClick) {
  modalRoot.innerHTML = `<div class="backdrop"><div class="modal">${html}</div></div>`;
  modalOnClick = onClick;
}
function closeModal() { modalRoot.innerHTML = ""; modalOnClick = null; }

modalRoot.addEventListener("click", e => {
  if (e.target.classList.contains("backdrop")) return closeModal();
  const btn = e.target.closest("button");
  if (btn && modalOnClick) modalOnClick(btn, e);
});

  const list = opts.map(([k, label]) =>
    `<button data-k="${k}" class="${k === current ? "sel" : ""}">${label}<br><small>${yen(
      k === "free" ? state.settings.freeSet : k === "box" ? state.settings.boxSet : state.settings.counterSet
    )}</small></button>`).join("");
  openModal(`<h3>セットプラン</h3><div class="choices">${list}</div>
    <div class="actions"><button class="btn ghost" data-x="cancel">やめる</button></div>`, btn => {
    if (btn.dataset.x === "cancel") return closeModal();
    if (btn.dataset.k) { closeModal(); onPick(btn.dataset.k); }
  });
}

function askCast(onPick, title) {
  const list = state.settings.casts.map(c => `<button data-c="${esc(c)}">${esc(c)}</button>`).join("");
  openModal(`<h3>${esc(title || "どのキャスト？")}</h3><div class="choices">${list}
    <button data-other="1">その他（入力）</button>
    <button data-c="">指定なし</button></div>
    <div class="actions"><button class="btn ghost" data-x="cancel">やめる</button></div>`, btn => {
    if (btn.dataset.x === "cancel") return closeModal();
    if (btn.dataset.other) { closeModal(); return askName("キャスト名を入力", onPick); }
    if (btn.dataset.c !== undefined) { closeModal(); onPick(btn.dataset.c); }
  });
}

/* 登録外のキャスト名をその場で入れる。入れた名前は一覧にも追加して次から選べるようにする */
function askName(title, onOk) {
  openModal(`
    <h3>${esc(title)}</h3>
    <input class="pay-input" style="text-align:left; font-size:1.05rem" id="nm" placeholder="例）ヘルプの子">
    <div class="actions">
      <button class="btn ghost" data-x="cancel">やめる</button>
      <button class="btn" data-x="ok">決定</button>
    </div>`, btn => {
    if (btn.dataset.x === "cancel") return closeModal();
    if (btn.dataset.x !== "ok") return;
    const nm = modalRoot.querySelector("#nm").value.trim();
    if (!nm) return alert("名前を入れてください。");
    if (!state.settings.casts.includes(nm)) state.settings.casts.push(nm);
    closeModal();
    onOk(nm);
  });
}

function askOrigin(current, onPick) {
  const n = state.settings.nominate;
  const opts = [["normal", "通常客", n.normal], ["self", "自分呼び", n.self], ["dohan", "同伴", n.dohan]];
  openModal(`<h3>お客さんの区分</h3><div class="choices">${opts.map(([k, label, pct]) =>
    `<button data-k="${k}" class="${k === current ? "sel" : ""}">${label}<br><small>バック ${pct}%</small></button>`).join("")}</div>
    <div class="actions"><button class="btn ghost" data-x="cancel">やめる</button></div>`, btn => {
    if (btn.dataset.x === "cancel") return closeModal();
    if (btn.dataset.k) { closeModal(); onPick(btn.dataset.k); }
  });
}

function originLabel(o) { return o === "self" ? "自分呼び" : o === "dohan" ? "同伴" : "通常客"; }

function openCheckout(t) {
  let method = "cash";
  let received = 0;

  const draw = () => {
    const tt = totals(t, method);
    const change = received - tt.total;
    modalRoot.querySelector(".modal").innerHTML = `
      <h3>お会計 — ${t.seatId}</h3>
      <div class="choices" style="grid-template-columns:1fr 1fr">
        <button data-p="cash" class="${method === "cash" ? "sel" : ""}">現金</button>
        <button data-p="card" class="${method === "card" ? "sel" : ""}">カード</button>
      </div>
      <div class="totals" style="margin-top:16px">
        <div><span>小計</span><span>${yen(tt.subtotal)}</span></div>
        ${tt.service ? `<div><span>TAX ${state.settings.servicePct}%</span><span>${yen(tt.service)}</span></div>` : ""}
        ${tt.cardFee ? `<div><span>カード手数料 ${state.settings.cardFeePct}%</span><span>${yen(tt.cardFee)}</span></div>` : ""}
        <div class="grand"><span>合計</span><span>${yen(tt.total)}</span></div>
      </div>
      ${method === "cash" ? `
        <p class="tiny" style="margin:14px 0 6px">お預かり</p>
        <input class="pay-input" inputmode="numeric" id="recv" value="${received || ""}" placeholder="0">
        <div class="change"><span>お釣り</span><span>${change >= 0 ? yen(change) : "—"}</span></div>` : ""}
      <div class="actions">
        <button class="btn ghost" data-x="cancel">やめる</button>
        <button class="btn" data-x="done">会計を確定</button>
      </div>`;
    const recv = modalRoot.querySelector("#recv");
    if (recv) {
      recv.addEventListener("input", () => { received = Number(recv.value.replace(/[^0-9]/g, "")) || 0; });
      recv.addEventListener("change", draw);
    }
  };

  openModal("", btn => {
    if (btn.dataset.p) { method = btn.dataset.p; return draw(); }
    if (btn.dataset.x === "cancel") return closeModal();
    if (btn.dataset.x === "done") { closeModal(); closeTicket(t, method); }
  });
  draw();
}

/* ============ actions ============ */

function newTicket(seatId, type, people) {
  const t = {
    id: "t" + Date.now() + Math.random().toString(36).slice(2, 6),
    no: state.seq++,
    seatId, seatType: type, plan: type, people, sets: 1,
    nominee: "", origin: "normal",
    openedAt: Date.now(), closedAt: null,
    items: [], status: "open", payment: null,
  };
  state.tickets.push(t);
  save();
  view = { ...view, name: "ticket", ticketId: t.id };
  render();
}

function addItem(t, menuItem, cast) {
  const same = t.items.find(it =>
    it.menuId === menuItem.id && (it.cast || "") === (cast || "") && it.price === menuItem.price);
  if (same) same.qty += 1;
  else t.items.push({
    menuId: menuItem.id, name: menuItem.name, price: menuItem.price,
    cat: menuItem.cat || String(menuItem.id).split(":")[0],
    qty: 1, cast: cast || "", backType: menuItem.backType,
  });
  save(); render();
}

function closeTicket(t, method) {
  const tt = totals(t, method);
  t.status = "closed";
  t.closedAt = Date.now();
  t.payment = { method, subtotal: tt.subtotal, service: tt.service, cardFee: tt.cardFee, total: tt.total };
  save();
  view = { ...view, name: "tables", ticketId: null };
  render();
}

function csv(tickets, filename) {
  const head = ["日付", "伝票No", "卓", "指名", "区分", "人数", "開始", "終了", "支払", "小計", "TAX", "カード手数料", "合計", "商品", "数量", "単価", "キャスト"];
  const rows = [head];
  tickets.forEach(t => {
    const base = [dayKey(t.closedAt), t.no, t.seatId, t.nominee || "", originLabel(t.origin), t.people, hhmm(t.openedAt), hhmm(t.closedAt),
      t.payment.method === "card" ? "カード" : "現金",
      t.payment.subtotal, t.payment.service, t.payment.cardFee, t.payment.total];
    rows.push(base.concat([`セット料金（${planLabel(planOf(t))}）`, t.people * t.sets, setUnit(t), ""]));
    t.items.forEach(it => rows.push(base.concat([it.name, it.qty, it.price, it.cast || ""])));
  });
  download(toCsv(rows), filename, "text/csv;charset=utf-8");
}

/* Excel が文字化けしないよう BOM を付ける */
function toCsv(rows) {
  return "﻿" + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
}

function download(text, filename, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function csvExpenses() {
  const rows = [["日付", "内容", "金額"]];
  state.expenses.slice().sort((a, b) => a.date.localeCompare(b.date))
    .forEach(e => rows.push([e.date, e.name, e.amount]));
  download(toCsv(rows), "expenses-all.csv", "text/csv;charset=utf-8");
}

function exportJson() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "blm-pos-backup-" + dayKey(Date.now()) + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function importJson() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json";
  input.addEventListener("change", () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        state = Object.assign(defaultState(), JSON.parse(String(reader.result)));
        save(); render();
        alert("読み込みました。");
      } catch (e) {
        alert("ファイルを読めませんでした。");
      }
    };
    reader.readAsText(file);
  });
  input.click();
}

/* ============ events ============ */

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || modalRoot.contains(el)) return;
  const act = el.dataset.act;
  const t = ticketById(view.ticketId);

  if (act === "go") { view = { ...view, name: el.dataset.view }; return render(); }
  if (act === "go-ticket") { view = { ...view, name: "ticket", ticketId: el.dataset.id }; return render(); }

  if (act === "open-seat") {
    const seat = el.dataset.seat, type = el.dataset.type;
    return askPeople(1, n => newTicket(seat, type, n));
  }
  if (act === "people" && t) return askPeople(t.people, n => { t.people = n; save(); render(); });
  if (act === "nominee" && t) return askCast(c => { t.nominee = c; save(); render(); }, "誰の指名？");
  if (act === "origin" && t) return askOrigin(t.origin, o => { t.origin = o; save(); render(); });
  if (act === "plan" && t) return askPlan(planOf(t), p => {
    t.plan = p;
    if (p === "free") t.sets = 1;
    save(); render();
  });
  if (act === "cat") { view.cat = el.dataset.cat; return render(); }

  if (act === "add" && t) {
    const m = state.menu.find(x => x.id === el.dataset.id);
    if (!m) return;
    /* ASK 品（時価）はその場で金額を入れてもらう */
    if (m.price === null) {
      return askCustom({ name: m.name, lockName: true, title: m.name + " の金額" },
        (nm, pr) => addItem(t, { ...m, price: pr }, ""));
    }
    if (m.backType) return askCast(cast => addItem(t, m, cast));
    return addItem(t, m, "");
  }
  if (act === "custom" && t) {
    return askCustom({}, (nm, pr) =>
      addItem(t, { id: "custom:" + nm + ":" + pr, name: nm, price: pr, backType: null }, ""));
  }
  if (act === "qty" && t) {
    const i = Number(el.dataset.i);
    t.items[i].qty += Number(el.dataset.d);
    if (t.items[i].qty <= 0) t.items.splice(i, 1);
    save(); return render();
  }
  if (act === "extend" && t) { t.sets += 1; save(); return render(); }
  if (act === "checkout" && t) return openCheckout(t);
  if (act === "void" && t) {
    if (!confirm("この伝票を取り消します。よろしいですか？")) return;
    state.tickets = state.tickets.filter(x => x.id !== t.id);
    save(); view = { ...view, name: "tables", ticketId: null }; return render();
  }

  if (act === "delete-ticket") {
    if (!confirm("この会計を取り消します。よろしいですか？")) return;
    state.tickets = state.tickets.filter(x => x.id !== el.dataset.id);
    save(); return render();
  }
  if (act === "add-shift") return askShift(x => { state.shifts.push(x); save(); render(); });
  if (act === "edit-pay") return askPayOverride(el.dataset.id, currentMonth());
  if (act === "edit-shift") return editEntry(state.shifts, el.dataset.id, askShift);
  if (act === "edit-adj") return editEntry(state.adjustments, el.dataset.id, askAdjustment);
  if (act === "edit-expense") return editEntry(state.expenses, el.dataset.id, askExpense);
  if (act === "edit-manual") return editEntry(state.manualSales, el.dataset.id, askManualSale);
  if (act === "add-adj") return askAdjustment(x => { state.adjustments.push(x); save(); render(); });
  if (act === "add-manual") return askManualSale(x => { state.manualSales.push(x); save(); render(); });
  if (act === "csv-payroll") return csvPayroll(currentMonth());
  if (act === "delete-shift") { state.shifts = state.shifts.filter(x => x.id !== el.dataset.id); save(); return render(); }
  if (act === "delete-adj") { state.adjustments = state.adjustments.filter(x => x.id !== el.dataset.id); save(); return render(); }
  if (act === "delete-manual") { state.manualSales = state.manualSales.filter(x => x.id !== el.dataset.id); save(); return render(); }
  if (act === "add-expense") {
    return askExpense(e => { state.expenses.push(e); save(); render(); });
  }
  if (act === "delete-expense") {
    if (!confirm("この経費を取り消します。よろしいですか？")) return;
    state.expenses = state.expenses.filter(x => x.id !== el.dataset.id);
    save(); return render();
  }
  if (act === "csv-expenses") {
    if (!state.expenses.length) return alert("経費データがありません。");
    return csvExpenses();
  }
  if (act === "csv-today") {
    const today = dayKey(Date.now());
    const list = state.tickets.filter(x => x.status === "closed" && dayKey(x.closedAt) === today);
    if (!list.length) return alert("本日の会計がありません。");
    return csv(list, "sales-" + today + ".csv");
  }
  if (act === "csv-all") {
    const list = state.tickets.filter(x => x.status === "closed");
    if (!list.length) return alert("会計データがありません。");
    return csv(list, "sales-all.csv");
  }

  if (act === "add-menu") {
    const cat = prompt("カテゴリ名", view.cat || "その他");
    if (!cat) return;
    const name = prompt("商品名");
    if (!name) return;
    const price = Number(prompt("価格（数字のみ）", "1000"));
    if (!Number.isFinite(price)) return;
    state.menu.push({ id: cat + ":" + name + ":" + Date.now(), cat, name, price, backType: null });
    save(); return render();
  }
  if (act === "del-menu") {
    state.menu.splice(Number(el.dataset.i), 1);
    save(); return render();
  }
  if (act === "export") return exportJson();
  if (act === "import") return importJson();
  if (act === "clear-sales") {
    const n = state.tickets.length;
    if (!confirm("レジの伝票 " + n + " 件をすべて削除します。経費・給与・設定は残ります。よろしいですか？")) return;
    state.tickets = [];
    state.seq = 1;
    save(); return render();
  }
  if (act === "clear-manual") {
    const n = state.manualSales.length;
    if (!confirm("手入力の売上 " + n + " 件をすべて削除します。よろしいですか？")) return;
    state.manualSales = [];
    save(); return render();
  }
  if (act === "reset") {
    if (!confirm("すべての売上・設定を消去します。よろしいですか？")) return;
    state = defaultState(); save(); return render();
  }
});

document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.set !== undefined && el.dataset.set !== "") {
    state.settings[el.dataset.set] = Number(el.value) || 0;
  } else if (el.dataset.back !== undefined && el.dataset.back !== "") {
    state.settings.back[el.dataset.back] = Number(el.value) || 0;
  } else if (el.dataset.nom !== undefined && el.dataset.nom !== "") {
    state.settings.nominate[el.dataset.nom] = Number(el.value) || 0;
  } else if (el.hasAttribute("data-casts")) {
    state.settings.casts = el.value.split(",").map(s => s.trim()).filter(Boolean);
  } else if (el.hasAttribute("data-expcats")) {
    state.settings.expenseCats = el.value.split(",").map(s => s.trim()).filter(Boolean);
  } else if (el.hasAttribute("data-staff")) {
    state.settings.staff = el.value.split(",").map(s => s.trim()).filter(Boolean);
  } else if (el.dataset.wage !== undefined && el.dataset.wage !== "") {
    state.settings.wages[el.dataset.wage] = Number(el.value) || 0;
  } else if (el.hasAttribute("data-month")) {
    view.month = el.value; render(); return;
  } else if (el.dataset.menuName !== undefined && el.dataset.menuName !== "") {
    state.menu[Number(el.dataset.menuName)].name = el.value;
  } else if (el.dataset.menuPrice !== undefined && el.dataset.menuPrice !== "") {
    state.menu[Number(el.dataset.menuPrice)].price = el.value === "" ? null : (Number(el.value) || 0);
  } else return;
  save();
});

/* live clock + elapsed minutes without full re-render */
function tick() {
  const now = new Date();
  document.getElementById("clock").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
  document.querySelectorAll("[data-since]").forEach(el => {
    el.textContent = minutesSince(Number(el.dataset.since)) + "分";
  });
}
setInterval(tick, 20000);

render();
tick();
</script>
